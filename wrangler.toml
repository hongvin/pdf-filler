name = "pdf-filler"
main = "worker.js"
compatibility_date = "2026-09-18"

# Static site + one API route, served by a Worker rather than Pages. A Pages
# project always exposes <project>.pages.dev and that hostname cannot be
# removed or put behind Access; a Worker's workers.dev route can be disabled
# or gated. See README "About the access gate".
[assets]
directory = "./public"
binding = "ASSETS"
# Every request runs through worker.js so the security headers are applied to
# static responses too, and so a host check can be added later in one place.
run_worker_first = true

# Non-sensitive values. Secrets (BIDDER_IC) are set separately:
#   npx wrangler secret put BIDDER_IC
[vars]
BIDDER_NAME = "Koay Hong Vin"
BIDDER_COMPANY = "EDGE INTELLIGENCE SDN. BHD."
BIDDER_COMPANY_REG = "202301036017"
SIGNATURE_TEXT = "HongVin"
# KaushanScript | Norican | MrDafoe | GreatVibes
SIGNATURE_FONT = "KaushanScript"
# Second line inside the stamp — the company's old ROC number.
STAMP_LINE2 = "(1529940-V)"
