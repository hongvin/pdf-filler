name = "pdf-filler"
compatibility_date = "2026-09-18"
pages_build_output_dir = "public"

# Non-sensitive values. Secrets (BIDDER_IC) are set separately:
#   npx wrangler pages secret put BIDDER_IC --project-name pdf-filler
#
# There is no auth gate in code any more — access is enforced by Cloudflare
# Access in front of the custom domain. See README "About the access gate".
[vars]
BIDDER_NAME = "Koay Hong Vin"
BIDDER_COMPANY = "EDGE INTELLIGENCE SDN. BHD."
BIDDER_COMPANY_REG = "202301036017"
SIGNATURE_TEXT = "HongVin"
# KaushanScript | Norican | MrDafoe | GreatVibes
SIGNATURE_FONT = "KaushanScript"
# Second line inside the stamp — the company's old ROC number.
STAMP_LINE2 = "(1529940-V)"
